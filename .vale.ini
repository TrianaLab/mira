# Prose rules, run by `make docs-check`. The files it runs over come from the
# Makefile's `PROSE` list, not from here — see `.markdownlint-cli2.yaml`.
#
# Three rules, all of them errors, all of them in .vale/styles/Mira. There is
# no "warning" level on purpose: a warning is a rule nobody fixes.
#
# Sentence length was a fourth and is now in `xtask prose`: Vale's segmenter
# reads `6.7x.` as an abbreviation and runs the two sentences together, which
# on a page that quotes a ratio every other line is most of them.
StylesPath = .vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Mira

# Vale's own, and the only one worth borrowing: it catches "the the" across a
# line break, which is the typo that survives every human read.
Vale.Repetition = error
