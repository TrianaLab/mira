name: release

# Mira is a single binary, so the release artifacts *are* the product's front
# door. The whole file therefore has one rule: nothing is published until every
# platform has built. The matrix produces tarballs, one job checksums and
# attests them, one job turns the same bytes into a multi-arch image, and only
# then does the GitHub Release appear — followed by `verify-release`, which
# re-downloads what was actually published and checks it, because a release job
# that reports green having published nothing is a failure mode both this
# project and its neighbours have shipped.
#
# The operator is a second train on the same tag, with its own version, its own
# image and the only Helm chart Mira publishes. It shares `meta` and nothing
# else; see its section header below for why its publishers *skip* where the
# engine's refuse.
#
# Two invariants, both fail-closed and both learned the expensive way:
#
#   * A published coordinate is immutable. Every engine publisher asks the
#     registry whether the coordinate already exists and refuses rather than
#     overwriting it, so a re-run of a released tag is a red run and not a
#     silent swap of bytes somebody already verified against SHA256SUMS.
#   * Everything published is signed over its *digest*, never over a tag. A tag
#     is a mutable pointer; a signature over one says nothing about the bytes
#     that came back.
#
# The steps that build artifacts are `make` targets, not shell in this file, for
# the reason the Makefile header gives: ci.yml's `release-dry-run` leg runs the
# same targets on every pull request, so the release path is rehearsed rather
# than first executed in anger. `workflow_dispatch` at a branch then runs the
# whole thing with publishing switched off, so the first real tag is never the
# first test.
#
# Nobody pushes the tag by hand any more: ci.yml's `tag` job cuts it when a
# version bump merges. That job pushes with GITHUB_TOKEN, which does not start a
# workflow, so the `push: tags:` trigger below does not fire for it — the job
# calls `gh workflow run release.yml --ref vX.Y.Z` instead, and
# `workflow_dispatch` is one of the two events exempt from the loop protection.
# A dispatch at a tag ref is a real release: `meta` branches on GITHUB_REF_TYPE,
# not on the event, so `publish=true` and the OIDC subject stays
# `refs/tags/vX.Y.Z` — which is what `verify-release` pins. The `push` trigger
# stays for the hand-pushed case, which is now the recovery path rather than the
# normal one. docs/internals/releases.md has the whole argument.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress. A cancelled release is a half-published one: some
  # assets uploaded, an image pushed under `latest` that no release points at,
  # an attestation for a tarball nobody can download. Letting a superseded run
  # finish is strictly cheaper than reconciling that by hand.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/trianalab/mira
  # Charts live beside the images, not under them. `helm push` appends the
  # chart name to whatever repository it is given, so this is the parent and
  # the coordinate below is `${CHARTS}/mira-operator` — nesting charts inside an
  # image repository would make `ghcr.io/trianalab/mira` a directory and a
  # manifest at once, which is legal and confusing in equal measure.
  CHARTS: ghcr.io/trianalab/charts
  # A sibling coordinate, not a tag on `mira`. The operator is a different
  # program with a different entrypoint and a different permission model, and
  # publishing it as `ghcr.io/trianalab/mira:0.1.0-operator` would put two
  # unrelated things in one package's tag list where a `:latest` reader cannot
  # tell them apart.
  OPERATOR_IMAGE: ghcr.io/trianalab/mira-operator

jobs:
  # Everything downstream keys off these three strings, so they are computed
  # once. Deriving them per-job is how a release ends up tagged v0.2.0 with a
  # binary that prints 0.1.0.
  meta:
    name: meta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            # The tag and Cargo.toml have to agree, because `mira --version`
            # prints CARGO_PKG_VERSION and nothing downstream can fix that
            # afterwards. Fail here, before anything is uploaded.
            if [ "${version}" != "${crate}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${crate} in Cargo.toml"
              exit 1
            fi
          else
            version="${crate}-dev.${GITHUB_SHA::7}"
            publish=false
          fi

          # An explicit -rc/-beta suffix, and nothing else. 0.x used to be here
          # too, on the reading that a pre-1.0 project should say so — but
          # GitHub's `releases/latest` endpoint *excludes* prereleases, and that
          # endpoint is what scripts/get-mira.sh resolves when no --version is
          # given. Marking 0.0.1 a prerelease makes `curl install.sh | bash`
          # print "No release found" on the day of the first release. The
          # pre-1.0 warning belongs in CHANGELOG.md and SECURITY.md, which say
          # it already, not in a flag that turns the install one-liner off.
          case "${version}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          printf 'version=%s\npublish=%s\nprerelease=%s\n' \
            "${version}" "${publish}" "${prerelease}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: meta
    strategy:
      # One red platform should not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not 24.04, on purpose. zstd-sys is the only C
          # dependency in the tree and it is compiled against the runner's
          # glibc, so the runner picks the floor: 22.04 gives a binary whose
          # highest required symbol is GLIBC_2.34 (measured with `objdump -T`),
          # which runs on RHEL 9, Amazon Linux 2023, Debian 12, Ubuntu 22.04
          # and the distroless/cc-debian12 base the image uses. Building on
          # 24.04 links __isoc23_* at GLIBC_2.38 and silently drops all of them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm64 rather than a cross-compile: cross-compiling means a
          # C cross-toolchain for zstd-sys, which is exactly the machinery this
          # project refuses to carry. The runner label is free on public repos.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Cross-compiled from the arm64 runner. This one is safe where the
          # Linux equivalent is not: the macOS SDK carries both slices, so
          # clang cross-compiles zstd with -arch x86_64 and no extra toolchain.
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      # cargo honours this, so `make build` needs no --target and the Makefile
      # stays the single source of truth. Output lands under target/<triple>/.
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain action, matching ci.yml: rustup on the runner resolves
      # rust-toolchain.toml on the first cargo invocation. `target add` is a
      # no-op for the two native legs and the whole story for the other two.
      - run: rustup target add "${CARGO_BUILD_TARGET}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: ${{ matrix.target }}

      # The one build command in the repo. `[profile.release] strip = "symbols"`
      # in Cargo.toml means the artifact is already stripped, so there is no
      # strip step here to drift away from what `make drift` measures.
      # `make dist-tarball` also runs `make build`. The smoke test, the licence,
      # the AppleDouble suppression and the size line in the run summary all
      # live in that target now, together with the reasons — and, more to the
      # point, ci.yml's `release-dry-run` leg runs the same target on every pull
      # request. VERSION comes from the tag; TARGET the Makefile derives from
      # CARGO_BUILD_TARGET, which is already set on this job.
      - env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: make dist-tarball

      # The SBOM describes the dependency graph, which is identical on all four
      # targets, so it is generated once on the leg that has already compiled
      # rather than in a job that would compile a fifth time. `make build` from
      # the sbom target is a cache hit here.
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          tool: cargo-cyclonedx@0.5.9
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: make dist-sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # Checksums and provenance over the finished set, not per-leg: one SHA256SUMS
  # is what a user actually verifies against, and one attestation call covering
  # every subject in it is what `gh attestation verify` then checks.
  package:
    name: package
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Checked out only for the Makefile. `make dist-sums` is the same target
      # the dry run exercises, and the reasoning about why the file is written
      # outside dist/ and with bare names lives beside it rather than here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - run: make dist-sums

      - run: |
          set -euo pipefail
          {
            echo '### Release assets'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # subject-checksums attests every file named in SHA256SUMS in one
      # statement — the tarballs and the SBOM. Runs on dry runs too, because an
      # attestation step that only ever executes on a tag is untested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  image:
    name: image
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token is doing two jobs here: the SLSA attestation below, and
      # cosign's keyless signing, which exchanges this job's OIDC token for a
      # short-lived Fulcio certificate. Neither holds a private key anywhere.
      id-token: write
      attestations: write
    outputs:
      # The digest, not the tag, is what `verify-release` re-checks at the end.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*-unknown-linux-gnu
          merge-multiple: true
          path: artifacts

      # The image gets the same bytes the tarball got, rather than a second
      # compile inside the Dockerfile. That is faster, but mainly it means the
      # provenance statement over the tarball and the one over the image are
      # about one artifact, and `docker cp` out of the image reproduces a file
      # that is in SHA256SUMS.
      - env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"; triple="${pair##*:}-unknown-linux-gnu"
            mkdir -p "dist/linux/${arch}"
            tar -xzf "artifacts/mira-${VERSION}-${triple}.tar.gz" \
              -C "dist/linux/${arch}" --strip-components=1 \
              "mira-${VERSION}-${triple}/mira"
          done
          ls -l dist/linux/*/mira

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published coordinate is immutable, and nothing else in this run
      # enforces that for the image. `gh release create` further down refuses a
      # tag that already has a release — but by then the push below has already
      # replaced ghcr.io/trianalab/mira:<ver> and moved :latest, so the failure
      # arrives after the damage. Ask first.
      #
      # Four lines rather than an OCI ledger with adopt/conflict states: this
      # workflow publishes three coordinates from one linear DAG and never needs
      # to resume mid-flight. The ceiling is that two runs racing on the same
      # tag can both pass this check; concurrency above is not
      # cancel-in-progress, so they would queue instead, and a registry with
      # immutable tags configured is the real fix if that ever stops being true.
      - name: refuse to overwrite a published coordinate
        if: needs.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} is already published — refusing to overwrite an immutable tag. Bump the version in Cargo.toml and tag again."
            exit 1
          fi
          echo "${IMAGE}:${VERSION} is free"

      # No QEMU. With BIN=prebuilt neither the prebuilt stage nor the runtime
      # stage runs a command, so a linux/amd64 + linux/arm64 build is buildx
      # copying files the host already has.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN=prebuilt
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          # `outputs:` rather than the `push:` input, because a dry run still
          # builds both platforms and needs an explicit exporter — the default
          # docker exporter cannot hold a manifest list. Written as an
          # interpolation, not a `&&/||` ternary: the false branch of one of
          # those would have to be the empty string, which GitHub evaluates as
          # falsy, so the ternary would collapse and nothing would ever push.
          outputs: type=image,push=${{ needs.meta.outputs.publish }}
          # buildkit's own inline attestations would be a second, weaker
          # provenance record next to the SLSA one attached below.
          provenance: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.meta.outputs.publish == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Both, not either. The SLSA attestation above is the stronger statement —
      # it says which workflow, at which commit, produced these bytes — but it
      # is GitHub's format and `gh attestation verify` is how you read it.
      # cosign is what a Kubernetes admission controller (Sigstore policy
      # controller, Kyverno, Connaisseur) and Artifact Hub already speak. An
      # artifact only one of the two audiences can check is an artifact half the
      # world treats as unsigned.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.meta.outputs.publish == 'true'

      - name: sign the image
        if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Over the digest, never `${IMAGE}:${VERSION}`. A tag is a mutable
          # pointer, so a signature naming one certifies whatever that pointer
          # happens to address when the verifier looks — which is not a
          # statement about bytes at all.
          #
          # --new-bundle-format=false --use-signing-config=false: cosign v3
          # defaults to writing a Sigstore bundle into the OCI referrers API,
          # which is the better artifact and which Artifact Hub's indexer does
          # not read. It reads the legacy `sha256-<digest>.sig` tag cosign has
          # written since 2021, and the operator chart below has the same
          # requirement, so every signature this workflow raises uses the same
          # format for one story rather than two.
          #
          # ponytail: both flags are deprecated in cosign v3 — `--help` hides
          # them and the deprecation text says the new format "will be the only
          # supported format in future versions". So this has a hard ceiling: a
          # cosign that drops them breaks this step, loudly and on a tag. The
          # upgrade path is to delete both flags here and in `verify-release`
          # the day Artifact Hub speaks referrers, and until then the choice is
          # between a deprecated flag and a signature the world indexes as
          # absent. Bumping cosign-installer is therefore not a routine bump.
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # The operator: a second product, on a second version line
  # ---------------------------------------------------------------------------
  #
  # It rides the engine's tag but does not take the engine's version. The two
  # are not released together in any meaningful sense: the operator is a
  # controller for a Mira tier and works across a range of engine versions, so
  # tying its number to `v0.0.5` would claim a correspondence that does not
  # exist and force a version bump on it every time the engine ships.
  #
  # So: `charts/mira-operator/Chart.yaml` is the version, and the jobs below are
  # idempotent. If that number is already published they skip rather than fail —
  # which is the opposite of the rule the engine's publishers follow, and the
  # difference is deliberate. For the engine, an existing coordinate means the
  # tag was cut twice and something is wrong. For the operator it is the normal
  # case: most engine releases do not change it.
  #
  # ponytail: the ceiling is that the operator cannot ship a fix without an
  # engine release, because there is no second tag to hang one on. The upgrade
  # path is a `mira-operator/vX.Y.Z` tag and a `push: tags:` filter beside the
  # existing one, on the day that costs somebody something. docs/internals/releases.md
  # has the argument, including why changesets is not that upgrade path yet.
  operator-meta:
    name: operator-meta
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          chart=charts/mira-operator/Chart.yaml
          version=$(sed -n 's/^version: *//p' "${chart}" | head -1)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "${chart}" | head -1)
          # The chart installs a Deployment whose image tag defaults to
          # appVersion, so a chart at 0.2.0 carrying appVersion 0.1.0 ships a
          # controller one version behind the schema its own CRD declares. They
          # are published as one unit; they have to say one number.
          if [ "${version}" != "${app}" ]; then
            echo "::error::${chart} has version ${version} but appVersion ${app}; the chart and the image it installs are published together and must agree"
            exit 1
          fi
          [ -n "${version}" ] || { echo "::error::no version in ${chart}"; exit 1; }
          # And the third number in that file: `artifacthub.io/images` is a
          # literal, not a template, and nothing renders it — so a stale one is
          # Artifact Hub scanning last release's image for CVEs and reporting
          # them against this one. Only `verify-release`'s `helm template` check
          # covers the *rendered* tag; this covers the annotation.
          ann=$(sed -n 's|^ *image: ghcr.io/trianalab/mira-operator:||p' "${chart}" | head -1)
          if [ "${ann}" != "${version}" ]; then
            echo "::error::${chart}'s artifacthub.io/images annotation names ${ann:-nothing}, not ${version}"
            exit 1
          fi
          echo "version=${version}" | tee -a "$GITHUB_OUTPUT"

  # Two native runners rather than one with QEMU, for the reason the `build`
  # matrix gives: the operator's Dockerfile *compiles*, so a cross-platform
  # buildx pass would emulate a 160-crate build. The arm64 label is free on
  # public repositories.
  #
  # Each leg pushes an unnamed manifest by digest and hands the digest on as a
  # file; `operator-image` joins them into the index. Matrix jobs cannot use
  # `outputs:` for this — every leg writes the same key and the last one wins.
  operator-build:
    name: operator-build (${{ matrix.arch }})
    needs: [meta, operator-meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.meta.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dry run builds and throws the result away. It still compiles both
      # architectures, which is the half of this that can actually be wrong.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The repository root: Cargo.lock, the nested workspace and the
          # Dockerfile are three different directories.
          context: .
          file: integrations/kubernetes/Dockerfile
          build-args: |
            VERSION=${{ needs.operator-meta.outputs.version }}
            REVISION=${{ github.sha }}
          outputs: >-
            ${{ needs.meta.outputs.publish == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.OPERATOR_IMAGE)
                || 'type=cacheonly' }}
          provenance: false

      - if: needs.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.meta.outputs.publish == 'true'
        with:
          name: operator-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  operator-image:
    name: operator-image
    needs: [meta, operator-meta, operator-build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
      published: ${{ steps.free.outputs.free }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip, not fail. See the section header: an operator version that is
      # already published is the normal outcome of an engine release that did
      # not touch it.
      - id: free
        env:
          VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${OPERATOR_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::${OPERATOR_IMAGE}:${VERSION} is already published — this release does not change the operator."
            echo "free=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "free=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.free.outputs.free == 'true'
        with:
          pattern: operator-digest-*
          merge-multiple: true
          path: digests

      # `imagetools create` writes the index over manifests that are already in
      # the registry, so nothing is re-uploaded and nothing is emulated.
      - id: join
        if: steps.free.outputs.free == 'true'
        env:
          VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          refs=$(cd digests && printf "${OPERATOR_IMAGE}@sha256:%s " *)
          echo "joining: ${refs}"
          # No `:latest`. The engine moves it because `docker run
          # ghcr.io/trianalab/mira` is in the README; nothing installs the
          # operator by anything but a chart, and a floating tag on a controller
          # with a CRD is how a cluster ends up running a binary that does not
          # match the schema it was installed with.
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${OPERATOR_IMAGE}:${VERSION}" ${refs}
          digest=$(docker buildx imagetools inspect "${OPERATOR_IMAGE}:${VERSION}" \
            --format '{{ .Manifest.Digest }}')
          [ -n "${digest}" ] || { echo "::error::no digest for the joined index"; exit 1; }
          echo "digest=${digest}" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.free.outputs.free == 'true'
        with:
          subject-name: ${{ env.OPERATOR_IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.free.outputs.free == 'true'

      - name: sign the operator image
        if: steps.free.outputs.free == 'true'
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          set -euo pipefail
          # The same two deprecated flags and the same reason as the engine's
          # image: Artifact Hub reads the legacy `.sig` tag, not the referrers
          # API, and this image is what the chart's Artifact Hub entry points at.
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${OPERATOR_IMAGE}@${DIGEST}"

  # The only chart Mira publishes. `helm push` appends the chart name to the
  # repository it is given, so this lands at ${CHARTS}/mira-operator with no
  # extra configuration — which is why ${CHARTS} is a parent coordinate rather
  # than the chart's own, and why `charts/mira` being removed cost nothing here.
  operator-chart:
    name: operator-chart
    needs: [meta, operator-meta, operator-image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      published: ${{ steps.free.outputs.free }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: free
        env:
          VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          if helm show chart "oci://${CHARTS}/mira-operator" --version "${VERSION}" >/dev/null 2>&1; then
            echo "::notice::${CHARTS}/mira-operator:${VERSION} is already published."
            echo "free=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "free=true" | tee -a "$GITHUB_OUTPUT"
          fi

      # No --version or --app-version override, unlike the engine's chart: the
      # numbers in Chart.yaml *are* the release, and `operator-meta` already
      # proved the two agree. Passing them here would let a tag quietly restamp
      # a chart whose CRD says something else.
      - if: steps.free.outputs.free == 'true'
        run: |
          set -euo pipefail
          mkdir -p operator-chart-dist
          helm package charts/mira-operator --destination operator-chart-dist
          ls -l operator-chart-dist

      - id: push
        if: steps.free.outputs.free == 'true'
        env:
          VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          helm push "operator-chart-dist/mira-operator-${VERSION}.tgz" "oci://${CHARTS}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log | tail -1)
          [ -n "${digest}" ] || { echo "::error::helm push printed no digest"; exit 1; }
          echo "digest=${digest}" | tee -a "$GITHUB_OUTPUT"

      - name: sign the operator chart
        if: steps.free.outputs.free == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            "${CHARTS}/mira-operator@${DIGEST}"

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # The ownership handshake. An OCI repository has no `index.yaml` to carry
      # `artifacthub-repo.yml` beside, so Artifact Hub looks for it under a
      # reserved tag on the chart repository itself. Getting the tag or either
      # media type wrong does not fail anything here — it just silently leaves
      # the repository unverified — so all three are copied from Artifact Hub's
      # docs verbatim and none of them is ours to pick.
      #
      # Deliberately *not* behind `steps.free`: the two above are, because a
      # published chart version is immutable, but this tag is mutable and a
      # repository that loses it loses the badge. Idempotent by construction —
      # the same bytes produce the same digest — so pushing it on a release that
      # changed no operator code is free and skipping it is not.
      #
      # It moved here from the `chart` job when `charts/mira` was removed. The
      # `repositoryID` in the file did not change: an Artifact Hub repository is
      # a registration with a URL field, so this is a control-panel edit rather
      # than a second registration. Until that edit is made the badge points at
      # a repository with nothing in it.
      - name: publish the Artifact Hub repository metadata
        run: |
          set -euo pipefail
          oras push "${CHARTS}/mira-operator:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Created last, on purpose. The GitHub Release is the only coordinate a human
  # reads as "this shipped", so it must not exist until the image already does —
  # the other order produces release notes pointing at a pull that 404s.
  #
  # Not `needs: operator-chart`. The operator is a separate release train (see
  # the section header above) and a controller that failed to build must not
  # hold back an engine release that is otherwise complete. `verify-release`
  # covers both, which is where a half-shipped run gets caught.
  release:
    name: release
    needs: [meta, package, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # gh is preinstalled on the runner and does exactly this, so there is no
      # third-party release action to pin and review.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # The Keep a Changelog section for this version, if there is one:
          # everything between `## [x.y.z]` and the next `## `. A missing
          # section degrades to --generate-notes rather than failing, because a
          # release with autogenerated notes beats a tag with no release.
          notes_arg=(--generate-notes)
          if [ -f CHANGELOG.md ]; then
            awk -v v="${VERSION}" '
              $0 ~ "^## \\[" v "\\]" { f = 1; next }
              f && /^## / { exit }
              f { print }
            ' CHANGELOG.md > NOTES.md
            if [ -s NOTES.md ]; then
              notes_arg=(--notes-file NOTES.md)
            else
              echo "::warning::no '## [${VERSION}]' section in CHANGELOG.md — using generated notes"
            fi
          fi

          # `if`, not `[ x ] && y=z`. bash exempts the AND-list form from
          # `set -e` here, so it happens to work — but it evaluates to 1 on the
          # non-prerelease path, and the day someone moves it to the end of a
          # step that becomes a red release for a 1.0.0 tag. Write the form
          # that has no such edge.
          prerelease_arg=()
          if [ "${PRERELEASE}" = true ]; then
            prerelease_arg=(--prerelease)
          fi

          gh release create "${TAG}" \
            --title "mira ${VERSION}" \
            --verify-tag \
            "${notes_arg[@]}" \
            "${prerelease_arg[@]}" \
            dist/*

  # Last, because it is the least reversible thing this workflow does. A ghcr
  # tag can be overwritten by a later release and a GitHub Release can be
  # deleted outright; a crates.io version is consumed the moment it uploads and
  # `cargo yank` only hides it from new resolutions. So it goes after the
  # Release exists, when everything else has already worked.
  #
  # No checkout cache and no rehearsal flag: ci.yml's release-dry-run leg runs
  # `make publish-dry` on every code PR, which is this minus the upload.
  crates:
    name: crates
    needs: [meta, release]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `ui/dist` is committed and `make publish` builds each package out of
      # the tarball it just produced, so there is no npm step here — the
      # `include_bytes!` the binary needs is already in the tree, and ci.yml
      # fails a `.svelte` change that was not rebuilt.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Create a crates.io" \
                 "API token scoped to publish-new and publish-update and add it" \
                 "as a repository secret. Everything else in this release has" \
                 "already published; re-run this job once the secret exists."
            exit 1
          fi
          make publish

  # Everything above verifies its own inputs. Nothing above verifies the
  # *output*, and the failure mode that gap allows is a run that is green having
  # published nothing usable: an asset list that silently lost a leg, a
  # signature raised over a digest the registry no longer serves, an attestation
  # whose subject name does not match the file people actually download.
  #
  # So this job throws away every artifact and every output the run produced,
  # re-downloads what a stranger would download, and checks it with the same
  # commands docs/install.md tells a stranger to run. It is the only job here
  # whose inputs are not this workflow's own state — which is the entire point.
  verify-release:
    name: verify-release
    needs: [meta, image, release, crates, operator-meta, operator-build, operator-image, operator-chart]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # No id-token: verification is a read. cosign's keyless verify reads the
      # Rekor transparency log and Fulcio's roots, and needs no identity of its
      # own — a verifier that has to authenticate is a verifier nobody runs.
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      # Before anything logs in, because after that this cannot fail.
      #
      # A ghcr package is private until somebody makes it public and the first
      # release is what creates it — which used to be the argument for logging
      # in and calling visibility somebody else's problem. v0.0.1 is what that
      # costs: both packages published private, so `docker run
      # ghcr.io/trianalab/mira` and `helm install oci://...` — the two lines the
      # README hands a stranger — were DENIED for everyone, Artifact Hub's first
      # tracking pass failed with the same error, and this workflow went green.
      # The release where it can be wrong is the release that has to check.
      #
      # curl rather than docker or helm on purpose: no config file to read a
      # credential out of, so it cannot quietly start passing because some
      # earlier step authenticated. A failure here does not mean the bytes are
      # wrong — they are published and correct — it means a setting is, so the
      # fix is the package's settings page and not a version bump.
      - name: a stranger can pull the image and the chart
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OPERATOR_VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          anon() {
            local repo="$1" ref="$2" token
            token=$(curl -fsS \
              "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            [ -n "${token}" ] || return 1
            curl -fsS -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/${repo}/manifests/${ref}"
          }
          rc=0
          for target in "${IMAGE#ghcr.io/}:${VERSION}" \
                        "${OPERATOR_IMAGE#ghcr.io/}:${OPERATOR_VERSION}" \
                        "${CHARTS#ghcr.io/}/mira-operator:${OPERATOR_VERSION}"; do
            if anon "${target%:*}" "${target##*:}"; then
              echo "anonymous pull of ghcr.io/${target} ok"
            else
              echo "::error::ghcr.io/${target} is not pullable anonymously. The" \
                   "package is private — make it public on its package settings" \
                   "page. The published bytes are correct and need no new version."
              rc=1
            fi
          done
          exit "${rc}"

      # Everything below is a supply-chain question rather than an availability
      # one, and deliberately authenticates: whether a signature verifies must
      # not depend on a visibility setting. The step above is what holds the
      # setting.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: the release assets are the ones that were checksummed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --dir verify
          cd verify
          ls -l
          # sha256sum -c is the whole check, and it fails on a missing file as
          # well as on a wrong one, so a lost matrix leg is caught here too.
          sha256sum -c SHA256SUMS

      - name: the tarballs carry SLSA provenance from this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # One subject is enough to prove the attestation exists and resolves;
          # `package` raised a single statement over every name in SHA256SUMS,
          # so if this one verifies the rest were in the same statement. x86_64
          # linux because it is the artifact the install instructions reach for
          # first.
          gh attestation verify \
            "verify/mira-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --repo "${REPO}"

      - name: the image digest is signed by this workflow
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The identity is pinned to this workflow file on a tag ref, not left
          # to `--certificate-identity-regexp '.*'`. A signature by *somebody*
          # with a GitHub OIDC token is not a signature by us, and the loose
          # regexp is the commonest way a verify step ends up proving nothing.
          #
          # --new-bundle-format=false has to be repeated on the verify side:
          # cosign v3 defaults it to true on *both* sign and verify, so a
          # verifier left on the default looks in the referrers API and reports
          # a correctly signed artifact as unsigned. That is precisely the trap
          # Artifact Hub is in, which is why this step exists at all.
          cosign verify \
            --new-bundle-format=false \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp="^https://github\.com/${REPO}/\.github/workflows/release\.yml@refs/tags/" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "image ${IMAGE}@${DIGEST} verified"

      - name: all three crates are on crates.io at this version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The sparse index, not the API: it is the file Cargo itself resolves
          # against, so a version that answers here is a version `cargo add`
          # can actually reach. The API can serve a crate whose index entry has
          # not propagated, which is the difference between "we uploaded it"
          # and "a stranger can depend on it".
          #
          # Sparse-index paths are bucketed by name length — 1/x, 2/xy, 3/x/xyz,
          # then aa/bb/name. All three of ours are long enough for the last.
          rc=0
          for crate in miradb miradb-core miradb-proto; do
            if curl -fsS "https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}" \
                 | grep -q "\"vers\":\"${VERSION}\""; then
              echo "crates.io ${crate} ${VERSION} ok"
            else
              echo "::error::${crate} ${VERSION} is not in the crates.io index"
              rc=1
            fi
          done
          exit "${rc}"

      # The operator's two coordinates, checked the same way and on the same
      # terms. Unconditional, not `if: published == 'true'`: the question here
      # is whether a stranger can install the version the chart declares, and
      # that has to hold on the releases that republished nothing just as much
      # as on the one that first pushed it. A skipped publisher and a broken one
      # look identical from the outside, which is the gap this job exists for.
      - name: the operator image and chart are pullable and signed
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.operator-meta.outputs.version }}
        run: |
          set -euo pipefail
          helm show chart "oci://${CHARTS}/mira-operator" --version "${VERSION}"
          # The digest as the registry serves it now, not the one this run
          # produced: on a release that skipped the operator there is no output
          # to read, and the published bytes are the only thing worth checking.
          for coord in "${OPERATOR_IMAGE}:${VERSION}" "${CHARTS}/mira-operator:${VERSION}"; do
            digest=$(docker buildx imagetools inspect "${coord}" --format '{{ .Manifest.Digest }}')
            [ -n "${digest}" ] || { echo "::error::${coord} has no manifest"; exit 1; }
            cosign verify \
              --new-bundle-format=false \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp="^https://github\.com/${REPO}/\.github/workflows/release\.yml@refs/tags/" \
              "${coord%:*}@${digest}" > /dev/null
            echo "${coord%:*}@${digest} verified"
          done
          # The chart's default image tag is its appVersion, so this is the
          # assertion that an install of the chart pulls a manifest that exists.
          # A chart published against an image that never pushed is a
          # CrashLoopBackOff nothing else in this run would notice.
          helm template probe "oci://${CHARTS}/mira-operator" --version "${VERSION}" \
            | grep -q "image: ${OPERATOR_IMAGE}:${VERSION}"
          echo "the published chart installs the published image"

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: the Artifact Hub ownership metadata came back
        run: |
          set -euo pipefail
          # The one thing in this release whose loss nothing else notices: a
          # missing `artifacthub-repo.yml`, or one under a tag Artifact Hub does
          # not read, costs the Verified Publisher badge and reports nothing
          # anywhere. So it is fetched back from the coordinate the indexer
          # actually looks at.
          #
          # The assertion is a real UUID rather than a diff against the tree,
          # because this job deliberately has no checkout: everything it looks
          # at comes back off the wire. `cargo run -p xtask -- drift` is what holds
          # the ID to the right one; this holds the push to having happened.
          oras pull "${CHARTS}/mira-operator:artifacthub.io" --output pulled
          grep -Eq '^repositoryID: [0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$' \
            pulled/artifacthub-repo.yml
          echo "${CHARTS}/mira-operator:artifacthub.io carries an owner proof"

      - run: |
          set -euo pipefail
          {
            echo '### Verified after publication'
            echo
            echo '- both images and the chart are pullable with no credentials'
            echo '- SHA256SUMS matches every asset attached to the release'
            echo '- SLSA provenance resolves for the linux x86_64 tarball'
            echo '- the image digest carries a cosign signature from this workflow'
            echo '- all three crates resolve out of the crates.io sparse index'
            echo '- the operator image and chart pull, verify, and agree on a tag'
            echo '- the Artifact Hub ownership metadata round-trips'
          } >> "$GITHUB_STEP_SUMMARY"
