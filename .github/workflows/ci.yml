name: ci

# No trigger-level `paths:` filter, deliberately. A required check that is
# filtered out at the trigger never starts, never reports, and strict branch
# protection then waits for it forever — the classic way a repo ends up with
# PRs that can never merge. Filtering happens in the `changes` job instead,
# where a skipped leg still resolves the `required` gate at the bottom.
# scripts/check_ci.py fails the build if anyone reintroduces one.
#
# The weekly run is not redundant with the other two. Every leg here is gated on
# the `changes` job, and a CVE does not open a pull request: `supply-chain`
# (cargo-deny, RUSTSEC) and `image` (Trivy over the distroless base) both answer
# a question about the outside world, so without a clock they only get asked
# when someone happens to touch Rust code. Monday morning, before anyone starts.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR are worth cancelling; superseded pushes to main
  # are not — main's runs are what the coverage and drift history is made of.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # This file is a dispatcher. Every `run:` below is a `make ci-*` target
  # defined in `ci.mk`, and `scripts/check_ci.py` fails the build if one ever is
  # not — so every leg here is one command on a laptop, and there is no shell in
  # YAML for anyone to debug by pushing commits.
  #
  # `make ci` runs the whole list on one host. `make check` is the faster subset
  # to run before pushing: everything that needs no second toolchain, no docker
  # daemon and no several minutes.

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Locally: `make ci-changes`, which defaults the base to the merge-base
      # with origin/main. The regexes and the fail-open behaviour are in
      # scripts/ci-changes.sh, with the reasoning.
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make ci-changes CI_BASE="${BASE}"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Every platform reports even when one fails. macOS is here because the
      # cfg-gated code is real: `statfs` for the network-filesystem refusal,
      # `F_FULLFSYNC` for durable publish, `termios`/`TIOCGWINSZ` for the TUI.
      # A Linux-only matrix does not compile any of the macOS arms.
      #
      # arm64 Linux is here because the *format* is the product: blocks are
      # mmap'd Arrow read straight out of the mapping, and unaligned loads,
      # atomic ordering and `char` signedness are all places where "works on
      # x86_64" is not a statement about aarch64. The release ships four
      # targets, so at least the two that a runner can execute get tested.
      #
      # Nothing covers x86_64 Darwin: the Intel macOS runners are gone, so that
      # leg is cross-compiled and published unexecuted (see release.yml). It is
      # the same LP64 little-endian shape as the other three, which is why that
      # is a tolerable gap and not a hidden one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: rust-toolchain.toml pins the version and its
      # components, and rustup on the runner honours it on the first cargo
      # invocation. One less third-party action in the supply chain, and the
      # toolchain CI uses is the one a contributor gets by cloning.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # Two targets, because formatting, the feature swap and rustdoc are
      # platform-independent and running them three times would be three
      # chances to fail for the same reason. ci.mk says which is which.
      - run: make ci-rust
        if: matrix.os == 'ubuntu-latest'
      - run: make ci-rust-portable
        if: matrix.os != 'ubuntu-latest'

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # `rust-version` in Cargo.toml is a promise to anyone pinned to an older
      # toolchain, and a promise nothing compiles against is a wish. The target
      # reads the floor out of Cargo.toml, installs exactly it, and builds.
      - run: make ci-msrv

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira/ui/package-lock.json
      # `dist/` is checked in and `include_bytes!`d, so the bundle in git is
      # what ships: `ui-check` rebuilds it and diffs, and `ui-demo` builds the
      # recorded snapshot the site hosts at /play. Only `docs.yml` builds that
      # otherwise, and that runs after the merge, so a snapshot that renders a
      # blank page used to be a green pull request.
      - run: make ci-ui

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-llvm-cov
      # The ratchet lives in the Makefile (COVERAGE_MIN), not here, so raising
      # it is one diff and `make coverage` locally means the same thing.
      - run: make ci-coverage

  supply-chain:
    name: supply-chain
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny,cargo-machete
      # Advisories, licences, duplicate versions, and the ban on new C-backed
      # crates that keeps zstd-sys the only one. See deny.toml.
      - run: make ci-supply-chain

  drift:
    name: drift
    needs: changes
    # Docs are in the trigger set because the numbers being checked are quoted
    # in six files, five of which are docs. Editing prose is exactly how a
    # stale figure gets introduced.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: drift
      # Two halves of one question, and they share a release binary. `drift`
      # checks the crate count, the binary size against the section 11 ceiling,
      # the "only C dependency is zstd-sys" promise, and that every file quoting
      # those numbers quotes the current ones. `reference-check` regenerates the
      # reference pages from the binary's `--help`, the router's `.route(` calls
      # and the config parser's key list, and diffs — so a pull request that
      # adds an endpoint and not its row goes red.
      - run: make ci-drift

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # `mkdocs build --strict` plus mkdocs.yml's `validation:` block is the
      # whole link checker — a dead internal link or a missing anchor fails the
      # build. No separate link-checking action, and none needed. Then
      # shellcheck over `scripts/get-mira.sh`, because `docs/install.sh` is a
      # symlink to it: these are the bytes strangers pipe into bash.
      - run: make ci-docs

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    # Same pin as `e2e` and `release-dry-run`: `make scan-image` goes through
    # `dist-image`, which puts this runner's binary in the image and asserts its
    # glibc floor. Scanning an image built from a binary that could not ship is
    # scanning something else.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: image

      # The pin and its digest are in ci.mk, alongside the argument for why
      # this is a checksummed install script and not a third-party action.
      - run: make ci-tool-trivy

      # Builds the image from the binary `make build` produced — the same
      # BIN=prebuilt path release.yml takes — and scans it. Before this leg
      # existed a Dockerfile change landed unbuilt and unscanned, and the first
      # place a broken base image showed up was a tag.
      - run: make ci-image

  e2e:
    name: e2e
    needs: changes
    # Docs are in the trigger set because docs/e2e/ *is* the scenario: the
    # compose file and the collector config live there, so editing them has to
    # re-run the thing they describe.
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.docs == 'true'
    # ubuntu-22.04, the same pin and the same reason as release.yml's two linux
    # legs: this is the only job in the tree that *runs* the release binary
    # inside the release image, so building it against a glibc newer than the
    # distroless base makes it the only job that can catch that — and building
    # it on `ubuntu-latest` made it the job that caused it instead.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      # docs/internals/e2e.md has described this scenario since before CI could
      # run it: a real binary in a container, a stock OpenTelemetry Collector in
      # front of it, the OpenTelemetry project's own generator on the wire, and
      # then the query API asked whether the data arrived. Every other test in
      # the tree uses a client we wrote.
      - run: make ci-e2e

  release-dry-run:
    name: release-dry-run
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Same pin, because a rehearsal on a different runner than the performance
    # rehearses the wrong thing: `make dist` asserts the tarball's glibc floor,
    # and that assertion is only meaningful against the toolchain that will
    # actually cut the release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-dry-run
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-cyclonedx@0.5.9
      # Both halves of the release, run on every code PR: `make dist` is the
      # tarball, the SBOM and SHA256SUMS — literally the targets release.yml
      # calls on a tag — and `make publish-dry` packages all three crates,
      # resolves each against the one before it out of a temporary registry and
      # compiles them, stopping at the upload. The second matters most, because
      # a crates.io version is consumed the moment it uploads and `cargo yank`
      # hides it rather than freeing it.
      - run: make ci-release-dry-run

  helm:
    name: helm
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned, not `latest`. Helm 4 changed OCI defaults and the chart
          # tooling (helm-unittest, helm-docs) tracks the 3.x line; a chart that
          # lints on the runner and not on a contributor's machine is worse than
          # no gate. Move this and the chart's own floor in the same diff.
          version: v3.22.0
      # The unittest plugin and the helm-docs binary, at the versions the
      # Makefile pins — a tool pinned in two places is a tool pinned in neither.
      - run: make ci-tool-chart
      # lint, template, unittest, values-schema and helm-docs drift.
      - run: make ci-helm

  meta:
    name: meta
    # Never gated. This is the job that checks the other jobs, so a change that
    # breaks the gate graph must not be able to skip it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The section-sign gate below reads commit messages, so it needs the
          # commits — a shallow clone has the tree but not the range.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make ci-tool-actionlint
      - run: make ci-tool-python

      # Every job in this file must be reachable from a required context below,
      # every `run:` must be a `make ci-*` call, every `uses:` must be
      # SHA-pinned, and no required workflow may carry a trigger-level path
      # filter. Plus the U+00A7 scan over authored files. See scripts/check_ci.py
      # and scripts/check-section-sign.sh.
      - run: make ci-meta

      # The other two thirds of "authored content": what `git log` prints and
      # what a reviewer reads in the PR list. Neither is a tracked file, so the
      # file scan alone misses both.
      - name: no section sign in the commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-section-range RANGE="${BASE}..HEAD"
      - name: no section sign in the PR title or body
        env:
          # Through the environment, never interpolated into a command: a PR
          # title is attacker-controlled text, and `${{ }}` pastes it in before
          # the shell ever sees it.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        if: github.event_name == 'pull_request'
        run: make ci-section-text

  # Two status contexts, and branch protection requires both. Every leg above
  # feeds into one of them, so adding a job never means remembering to update a
  # setting in the GitHub UI — and `scripts/check_ci.py` fails if a job is ever
  # added that neither gate can see.
  #
  # They are split rather than merged because the *contexts* are the stable API
  # between this file and a branch-protection setting nobody in a PR can edit.
  # Security legs arrive at a different rate from correctness legs (a scanner,
  # a SARIF sink, a secret scan), and `security-required` lets them land without
  # a settings change and without diluting what `required` means.
  #
  # These two are the only `run:` steps in this file that are not a make call,
  # and scripts/check_ci.py allowlists them by name. They read
  # `join(needs.*.result)` — workflow state that exists nowhere but here — so
  # there is nothing for a local target to reproduce.
  required:
    name: required
    if: always()
    needs: [changes, rust, msrv, ui, coverage, supply-chain, drift, docs, e2e, release-dry-run, helm, meta]
    runs-on: ubuntu-latest
    steps:
      - name: Every leg green or deliberately skipped
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success) ;;
              # `skipped` is a pass on purpose: it is how the `changes` job
              # keeps a docs-only PR from paying for a macOS build. This is the
              # half of the aggregate-gate pattern people get wrong — treating
              # skipped as failure makes path filtering impossible, and treating
              # cancelled as success lets a cancelled run merge.
              skipped) ;;
              *) echo "::error::a required leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"

  # `supply-chain` is deliberately in both closures. It is the RUSTSEC half of
  # the same question `image` asks about the base layer, so it belongs here; and
  # removing it from `required` would mean a repository that has not yet turned
  # on the second context silently stops checking advisories.
  security-required:
    name: security-required
    if: always()
    needs: [changes, supply-chain, image]
    runs-on: ubuntu-latest
    steps:
      - name: Every security leg green or deliberately skipped
        # Same three-case loop as `required`, and for the same reasons — see the
        # comments there. Duplicated rather than factored into a composite
        # action because the check that keeps this honest, in
        # scripts/check_ci.py, reads `join(needs.*.result` out of the job body:
        # hide it behind a `uses:` and the gate can quietly stop inspecting
        # anything.
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a security leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"
