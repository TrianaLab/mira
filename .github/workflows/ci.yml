name: ci

# No trigger-level `paths:` filter, deliberately. A required check that is
# filtered out at the trigger never starts, never reports, and strict branch
# protection then waits for it forever — the classic way a repo ends up with
# PRs that can never merge. Filtering happens in the `changes` job instead,
# where a skipped leg still resolves the `required` gate at the bottom.
# scripts/check_ci.py fails the build if anyone reintroduces one.
#
# The weekly run is not redundant with the other two. Every leg here is gated on
# the `changes` job, and a CVE does not open a pull request: `supply-chain`
# (cargo-deny, RUSTSEC) and `image` (Trivy over the distroless base) both answer
# a question about the outside world, so without a clock they only get asked
# when someone happens to touch Rust code. Monday morning, before anyone starts.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR are worth cancelling; superseded pushes to main
  # are not — main's runs are what the coverage and drift history is made of.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job below is a one-line call into the Makefile. That is not a style
  # choice: the Makefile is the single source of truth for the gates (see its
  # header), so every gate here is reproducible with one `make` target.
  # A command that appears only in this file is a command nobody can reproduce.
  #
  # `make check` is the fast path and covers most of them. The four it leaves to
  # CI are `msrv`, `scan-image`, `e2e` and `dist`: each needs a toolchain, a
  # daemon or several minutes that a pre-push check should not assume.

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # dorny/paths-filter is the usual answer here. It is also one more
          # third-party action to pin, review and trust, for something `git
          # diff` already does in eight lines — and this repo's whole argument
          # is that a dependency has to earn its place.
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # First push to a branch, a force-push past the old tip, or a shallow
            # base. Unknown means "everything", never "nothing": a filter that
            # fails open costs CI minutes, one that fails closed ships bugs.
            echo "base ref '${BASE}' unusable — running every leg"
            code=true; docs=true; ui=true; image=true; chart=true
          else
            files=$(git diff --name-only "${BASE}" HEAD)
            echo "changed files:"; printf '%s\n' "${files}" | sed 's/^/  /'
            m() { printf '%s\n' "${files}" | grep -qE "$1" && echo true || echo false; }
            # A workflow change re-runs everything — the thing most likely to be
            # wrong about a CI edit is the leg you did not think it touched.
            W='|^\.github/workflows/'
            code=$(m "^(crates/|Cargo\.(toml|lock)\$|rust-toolchain\.toml\$|deny\.toml\$|Makefile\$|scripts/)${W}")
            # `overrides/` is the mkdocs theme override directory — one file, the
            # landing hero — and a Jinja error in it fails `mkdocs build --strict`
            # like any page would.
            # `scripts/get-mira.sh` is here rather than only in `code` because
            # `docs/install.sh` is a symlink to it: the docs site *publishes*
            # it, so it is a documentation artefact that happens to be a script,
            # and this is the leg that checks it.
            docs=$(m "^(docs/|overrides/|mkdocs\.yml\$|scripts/get-mira\.sh\$|.*\.md\$)${W}")
            # `Makefile$` for the same reason it is in `code` and `image`: both
            # of this leg's steps are make targets, so an edit to `ui-check` or
            # `ui-demo` is a change to what this job asserts.
            ui=$(m "^(crates/mira/ui/|Makefile\$)${W}")
            # The image is the binary plus the base image, so anything that
            # changes the binary changes what Trivy is looking at. Dockerfile
            # and .dockerignore are here for the obvious reason; Cargo.lock is
            # here because a dependency bump is exactly the change that
            # introduces the advisory this leg exists to catch.
            image=$(m "^(crates/|Cargo\.(toml|lock)\$|rust-toolchain\.toml\$|Dockerfile\$|\.dockerignore\$|Makefile\$)${W}")
            chart=$(m "^charts/${W}")
          fi
          printf 'code=%s\ndocs=%s\nui=%s\nimage=%s\nchart=%s\n' \
            "$code" "$docs" "$ui" "$image" "$chart" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Every platform reports even when one fails. macOS is here because the
      # cfg-gated code is real: `statfs` for the network-filesystem refusal,
      # `F_FULLFSYNC` for durable publish, `termios`/`TIOCGWINSZ` for the TUI.
      # A Linux-only matrix does not compile any of the macOS arms.
      #
      # arm64 Linux is here because the *format* is the product: blocks are
      # mmap'd Arrow read straight out of the mapping, and unaligned loads,
      # atomic ordering and `char` signedness are all places where "works on
      # x86_64" is not a statement about aarch64. The release ships four
      # targets, so at least the two that a runner can execute get tested.
      #
      # Nothing covers x86_64 Darwin: the Intel macOS runners are gone, so that
      # leg is cross-compiled and published unexecuted (see release.yml). It is
      # the same LP64 little-endian shape as the other three, which is why that
      # is a tolerable gap and not a hidden one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: rust-toolchain.toml pins the version and its
      # components, and rustup on the runner honours it on the first cargo
      # invocation. One less third-party action in the supply chain, and the
      # toolchain CI uses is the one a contributor gets by cloning.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # Formatting and rustdoc are platform-independent; running them twice
      # would just be two chances to fail for the same reason.
      - run: make fmt-check
        if: matrix.os == 'ubuntu-latest'
      - run: make lint
      # One platform: the feature swaps in a pure-Rust TLS connector, which has
      # no per-OS arms of its own, and paying for it on three runners buys
      # nothing.
      - run: make features
        if: matrix.os == 'ubuntu-latest'
      - run: make test
      - run: make doc
        if: matrix.os == 'ubuntu-latest'

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      # `rust-version` in Cargo.toml is a promise to anyone pinned to an older
      # toolchain, and a promise nothing compiles against is a wish. `make msrv`
      # reads the floor out of Cargo.toml, so this stays correct when it moves.
      - run: rustup toolchain install "$(make --no-print-directory print-msrv)" --profile minimal
      - run: make msrv

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira/ui/package-lock.json
      # `dist/` is checked in and `include_bytes!`d, so the bundle in git is
      # what ships. `make ui-check` rebuilds it and diffs: a .svelte fix that
      # was never rebuilt is a fix nobody gets.
      - run: make ui-check
      # The second build of the same source — the recorded snapshot the site
      # hosts at /play. Only `docs.yml` builds it otherwise, and that runs after
      # the merge, so a snapshot that renders a blank page was a green pull
      # request. The target asserts its own asset URLs; see the comment there.
      - run: make ui-demo

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-llvm-cov
      # The ratchet lives in the Makefile (COVERAGE_MIN), not here, so raising
      # it is one diff and `make coverage` locally means the same thing.
      - run: make coverage

  supply-chain:
    name: supply-chain
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny,cargo-machete
      # Advisories, licences, duplicate versions, and the ban on new C-backed
      # crates that keeps zstd-sys the only one. See deny.toml.
      - run: make deps

  drift:
    name: drift
    needs: changes
    # Docs are in the trigger set because the numbers being checked are quoted
    # in six files, five of which are docs. Editing prose is exactly how a
    # stale figure gets introduced.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: drift
      # Builds the release binary, then checks the crate count, the binary size
      # against the section 11 ceiling, the "only C dependency is zstd-sys"
      # promise, and that every file quoting those numbers quotes the current
      # ones.
      - run: make drift
      # The other half of the same question: the reference pages are generated
      # from the binary's `--help`, the router's `.route(` calls and the config
      # parser's key list, and this regenerates them and diffs. A pull request
      # that adds an endpoint and not its row goes red here. It lands in this
      # job because the generator needs the release binary and this is the job
      # that already has one.
      - run: make reference-check

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # `mkdocs build --strict` plus mkdocs.yml's `validation:` block is the
      # whole link checker — a dead internal link or a missing anchor fails the
      # build. No separate link-checking action, and none needed.
      - run: make docs
      # The other thing this site publishes: `docs/install.sh` is a symlink to
      # `scripts/get-mira.sh`, so these are the bytes strangers pipe into bash.
      # shellcheck is preinstalled on the runner image. See the target for the
      # one class of bug it checks that no runner here can reproduce.
      - run: make install-script

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    # Same pin as `e2e` and `release-dry-run`: `make scan-image` goes through
    # `dist-image`, which puts this runner's binary in the image and asserts its
    # glibc floor. Scanning an image built from a binary that could not ship is
    # scanning something else.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: image

      # Not aquasecurity/trivy-action. That action was compromised in March
      # 2026 — a pushed tag, a mutated release, and every workflow that had
      # `@v0` in it ran attacker code with whatever token the job held. The
      # lesson is not "pin the action", it is that an action is a program with
      # your token; an install script is a program with nothing but the runner.
      # So: the upstream script, fetched from a tag-immutable raw URL and
      # checked against its digest before it is run, exactly as `meta` installs
      # actionlint below. The script then verifies the release tarball against
      # the checksums file aquasecurity signs, so the whole chain is pinned.
      #
      # TRIVY_VERSION is here and not in the Makefile on purpose: locally
      # `make scan-image` uses whatever trivy you have, because a developer with
      # a newer database is a developer finding more, and only the gate needs a
      # version everyone agrees on.
      - name: install trivy
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_INSTALL_SHA256: e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
        run: |
          set -euo pipefail
          curl -fsSLo install.sh \
            "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh"
          echo "${TRIVY_INSTALL_SHA256}  install.sh" | sha256sum -c -
          sh install.sh -b /usr/local/bin "v${TRIVY_VERSION}"
          rm install.sh
          trivy --version

      # Builds the image from the binary `make build` produced — the same
      # BIN=prebuilt path release.yml takes — and scans it. Before this leg
      # existed a Dockerfile change landed unbuilt and unscanned, and the first
      # place a broken base image showed up was a tag.
      - run: make scan-image

  e2e:
    name: e2e
    needs: changes
    # Docs are in the trigger set because docs/e2e/ *is* the scenario: the
    # compose file and the collector config live there, so editing them has to
    # re-run the thing they describe.
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.docs == 'true'
    # ubuntu-22.04, the same pin and the same reason as release.yml's two linux
    # legs: this is the only job in the tree that *runs* the release binary
    # inside the release image, so building it against a glibc newer than the
    # distroless base makes it the only job that can catch that — and building
    # it on `ubuntu-latest` made it the job that caused it instead.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: e2e
      # docs/TESTING.md has described this scenario since before CI could run
      # it: a real binary in a container, a stock OpenTelemetry Collector in
      # front of it, the OpenTelemetry project's own generator on the wire, and
      # then the query API asked whether the data arrived. Every other test in
      # the tree uses a client we wrote.
      - run: make e2e

  release-dry-run:
    name: release-dry-run
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Same pin, because a rehearsal on a different runner than the performance
    # rehearses the wrong thing: `make dist` asserts the tarball's glibc floor,
    # and that assertion is only meaningful against the toolchain that will
    # actually cut the release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-dry-run
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-cyclonedx@0.5.9
      # `make dist` is the tarball, the SBOM and SHA256SUMS — literally the
      # targets release.yml calls on a tag. Running it here is the difference
      # between a release path that is tested and one that is first run in
      # anger, in public, with a tag already pushed that cannot be moved.
      - run: make dist

  helm:
    name: helm
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned, not `latest`. Helm 4 changed OCI defaults and the chart
          # tooling (helm-unittest, helm-docs) tracks the 3.x line; a chart that
          # lints on the runner and not on a contributor's machine is worse than
          # no gate. Move this and the chart's own floor in the same diff.
          version: v3.22.0
      # `make chart` needs the unittest plugin and the helm-docs binary, and
      # neither is on the runner. Both versions come out of the Makefile rather
      # than being written a second time here: a tool pinned in two places is a
      # tool pinned in neither, and the one that generates the file the drift
      # gate diffs has to be the version a contributor gets from `make`.
      - name: install the pinned chart tooling
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$(make -s print-helm-unittest-version)"
          go install "github.com/norwoodj/helm-docs/cmd/helm-docs@v$(make -s print-helm-docs-version)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # lint, template, unittest, values-schema and helm-docs drift, all behind
      # one target the same way every other leg here works. See the Makefile.
      - run: make chart

  meta:
    name: meta
    # Never gated. This is the job that checks the other jobs, so a change that
    # breaks the gate graph must not be able to skip it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The section-sign gate below reads commit messages, so it needs the
          # commits — a shallow clone has the tree but not the range.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # U+00A7 is banned in authored content, and "authored content" includes
      # what a reviewer reads in the PR list and what `git log` prints — neither
      # of which is a tracked file, so the file scan alone would miss both.
      - run: make section
      - name: no section sign in the commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/check-section-sign.sh --commits "${BASE}..HEAD"
      - name: no section sign in the PR title or body
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the script body: a
          # PR title is attacker-controlled text, and `${{ }}` pastes it in
          # before the shell ever sees it.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${TITLE}" | sh scripts/check-section-sign.sh --text "pr title"
          printf '%s' "${BODY}"  | sh scripts/check-section-sign.sh --text "pr body"

      # Not through taiki-e/install-action: it ships no actionlint manifest, and
      # its cargo-binstall fallback cannot find one either, because actionlint is
      # a Go program and not a crate. A release tarball checked against its
      # published digest is the same guarantee pinning an action by SHA gives, so
      # the version and the digest are both pinned here.
      - name: install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLo actionlint.tgz "${url}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          rm actionlint actionlint.tgz
      - run: pip install -r scripts/requirements.txt
      # Every job in this file must be reachable from the `required` context
      # below, every `uses:` must be SHA-pinned, and no required workflow may
      # carry a trigger-level path filter. See scripts/check_ci.py.
      - run: make workflows

  # Two status contexts, and branch protection requires both. Every leg above
  # feeds into one of them, so adding a job never means remembering to update a
  # setting in the GitHub UI — and `scripts/check_ci.py` fails if a job is ever
  # added that neither gate can see.
  #
  # They are split rather than merged because the *contexts* are the stable API
  # between this file and a branch-protection setting nobody in a PR can edit.
  # Security legs arrive at a different rate from correctness legs (a scanner,
  # a SARIF sink, a secret scan), and `security-required` lets them land without
  # a settings change and without diluting what `required` means.
  required:
    name: required
    if: always()
    needs: [changes, rust, msrv, ui, coverage, supply-chain, drift, docs, e2e, release-dry-run, helm, meta]
    runs-on: ubuntu-latest
    steps:
      - name: Every leg green or deliberately skipped
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success) ;;
              # `skipped` is a pass on purpose: it is how the `changes` job
              # keeps a docs-only PR from paying for a macOS build. This is the
              # half of the aggregate-gate pattern people get wrong — treating
              # skipped as failure makes path filtering impossible, and treating
              # cancelled as success lets a cancelled run merge.
              skipped) ;;
              *) echo "::error::a required leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"

  # `supply-chain` is deliberately in both closures. It is the RUSTSEC half of
  # the same question `image` asks about the base layer, so it belongs here; and
  # removing it from `required` would mean a repository that has not yet turned
  # on the second context silently stops checking advisories.
  security-required:
    name: security-required
    if: always()
    needs: [changes, supply-chain, image]
    runs-on: ubuntu-latest
    steps:
      - name: Every security leg green or deliberately skipped
        # Same three-case loop as `required`, and for the same reasons — see the
        # comments there. Duplicated rather than factored into a composite
        # action because the check that keeps this honest, in
        # scripts/check_ci.py, reads `join(needs.*.result` out of the job body:
        # hide it behind a `uses:` and the gate can quietly stop inspecting
        # anything.
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a security leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"
