name: ci

# No trigger-level `paths:` filter, deliberately. A required check that is
# filtered out at the trigger never starts, never reports, and strict branch
# protection then waits for it forever — the classic way a repo ends up with
# PRs that can never merge. Filtering happens in the `changes` job instead,
# where a skipped leg still resolves the `required` gate at the bottom.
# `cargo run -p xtask -- ci` fails the build if anyone reintroduces one.
#
# The weekly run is not redundant with the other two. Every leg here is gated on
# the `changes` job, and a CVE does not open a pull request: `supply-chain`
# (cargo-deny, RUSTSEC) and `image` (Trivy over the distroless base) both answer
# a question about the outside world, so without a clock they only get asked
# when someone happens to touch Rust code. Monday morning, before anyone starts.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  # Superseded pushes to a PR are worth cancelling; superseded pushes to main
  # are not — main's runs are what the coverage and drift history is made of.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # This file is a dispatcher. Every `run:` below is a `make ci-*` target
  # defined in `ci.mk`, and `cargo run -p xtask -- ci` fails the build if one ever is
  # not — so every leg here is one command on a laptop, and there is no shell in
  # YAML for anyone to debug by pushing commits.
  #
  # `make ci` runs the whole list on one host. `make check` is the faster subset
  # to run before pushing: everything that needs no second toolchain, no docker
  # daemon and no several minutes.

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      chart: ${{ steps.filter.outputs.chart }}
      operator: ${{ steps.filter.outputs.operator }}
      changeset: ${{ steps.filter.outputs.changeset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Locally: `make ci-changes`, which defaults the base to the merge-base
      # with origin/main. The regexes and the fail-open behaviour are in
      # scripts/ci-changes.sh, with the reasoning.
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make ci-changes CI_BASE="${BASE}"

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Every platform reports even when one fails. macOS is here because the
      # cfg-gated code is real: `statfs` for the network-filesystem refusal,
      # `F_FULLFSYNC` for durable publish, `termios`/`TIOCGWINSZ` for the TUI.
      # A Linux-only matrix does not compile any of the macOS arms.
      #
      # arm64 Linux is here because the *format* is the product: blocks are
      # mmap'd Arrow read straight out of the mapping, and unaligned loads,
      # atomic ordering and `char` signedness are all places where "works on
      # x86_64" is not a statement about aarch64. The release ships four
      # targets, so at least the two that a runner can execute get tested.
      #
      # Nothing covers x86_64 Darwin: the Intel macOS runners are gone, so that
      # leg is cross-compiled and published unexecuted (see release.yml). It is
      # the same LP64 little-endian shape as the other three, which is why that
      # is a tolerable gap and not a hidden one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: rust-toolchain.toml pins the version and its
      # components, and rustup on the runner honours it on the first cargo
      # invocation. One less third-party action in the supply chain, and the
      # toolchain CI uses is the one a contributor gets by cloning.
      # `env-vars: ImageOS` on every rust-cache in the tree, and it is load-
      # bearing rather than tidy. The automatic key records `Linux-x64` and not
      # which Ubuntu that is, so a `target/` built on 24.04 restores cleanly onto
      # a 22.04 runner and then dies in a build script — `GLIBC_2.39 not found`,
      # from a cached `getrandom` binary nothing in the job asked to rebuild.
      # Cargo fingerprints inputs, not the host libc, so it never notices. This
      # repo pins `image` and `release-dry-run` to 22.04 *because* the glibc
      # floor is the thing under test, which makes it the repo most likely to
      # mix the two. `ImageOS` is `ubuntu22`/`ubuntu24` in the runner's
      # environment and rust-cache hashes it into the key, so the two can no
      # longer see each other's caches. Empty off GitHub-hosted runners, which
      # degrades to the old behaviour rather than breaking.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: ${{ matrix.os }}

      # Two targets, because formatting, the feature swap and rustdoc are
      # platform-independent and running them three times would be three
      # chances to fail for the same reason. ci.mk says which is which.
      - run: make ci-rust
        if: matrix.os == 'ubuntu-latest'
      - run: make ci-rust-portable
        if: matrix.os != 'ubuntu-latest'

  msrv:
    name: msrv
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: msrv
      # `rust-version` in Cargo.toml is a promise to anyone pinned to an older
      # toolchain, and a promise nothing compiles against is a wish. The target
      # reads the floor out of Cargo.toml, installs exactly it, and builds.
      - run: make ci-msrv

  # `integrations/kubernetes/` is a second Cargo workspace, so `rust` above
  # cannot reach it: `--workspace` in the root manifest does not enumerate it,
  # and that is deliberate — kube-rs would move the crate count the README
  # publishes, raise the MSRV floor and fail `cargo deny`'s duplicate and
  # licence rules. The separation is in the Makefile's "The operator" section.
  #
  # One runner, not the three `rust` uses. The operator has no memory-mapped
  # on-disk format and no cfg-gated arms; it is API calls and arithmetic, and
  # "works on x86_64" is a statement about all of it.
  operator:
    name: operator
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          # Its own cache key and its own lock file. Sharing the engine's key
          # would evict one tree's artifacts on every alternate run.
          key: operator
          workspaces: integrations/kubernetes
      # The operator carries its own ratchet, because `cargo llvm-cov
      # --workspace` on the root manifest cannot reach a nested workspace — so
      # this leg needs the same tool the `coverage` leg does, for a different
      # tree and a different floor.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-llvm-cov
      # fmt, clippy, the unit tests, the coverage floor, and the CRD drift gate
      # — the generated schema has to match the Rust types, because
      # apiextensions silently prunes any field the schema does not name.
      - run: make ci-operator

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mira/ui/package-lock.json
      # `dist/` is checked in and `include_bytes!`d, so the bundle in git is
      # what ships: `ui-check` rebuilds it and diffs, and `ui-demo` builds the
      # recorded snapshot the site hosts at /play. Only `docs.yml` builds that
      # otherwise, and that runs after the merge, so a snapshot that renders a
      # blank page used to be a green pull request.
      - run: make ci-ui

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: coverage
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-llvm-cov
      # The ratchet lives in the Makefile (COVERAGE_MIN), not here, so raising
      # it is one diff and `make coverage` locally means the same thing.
      - run: make ci-coverage

  supply-chain:
    name: supply-chain
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-deny,cargo-machete
      # Advisories, licences, duplicate versions, and the ban on new C-backed
      # crates that keeps zstd-sys the only one. See deny.toml.
      - run: make ci-supply-chain

  drift:
    name: drift
    needs: changes
    # Docs are in the trigger set because the numbers being checked are quoted
    # in six files, five of which are docs. Editing prose is exactly how a
    # stale figure gets introduced.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: drift
      # Two halves of one question, and they share a release binary. `drift`
      # checks the crate count, the binary size against the section 11 ceiling,
      # the "only C dependency is zstd-sys" promise, and that every file quoting
      # those numbers quotes the current ones. `reference-check` regenerates the
      # reference pages from the binary's `--help`, the router's `.route(` calls
      # and the config parser's key list, and diffs — so a pull request that
      # adds an endpoint and not its row goes red.
      - run: make ci-drift

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # Three toolchains, because `ci-docs` is three gates. Python builds the
      # site; Node runs markdownlint; Rust runs `xtask prose`, which is in Rust
      # for the reason every other check here is — it gets fmt, clippy and
      # tests, and a check nobody can test is a check that quietly stops
      # matching.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: docs
      - run: make ci-tool-vale
      # `mkdocs build --strict` plus mkdocs.yml's `validation:` block is the
      # whole link checker — a dead internal link or a missing anchor fails the
      # build. No separate link-checking action, and none needed. Then
      # shellcheck over `scripts/get-mira.sh`, because `docs/install.sh` is a
      # symlink to it: these are the bytes strangers pipe into bash.
      - run: make ci-docs

  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    # Same pin as `release-dry-run`: `make scan-image` goes through
    # `dist-image`, which puts this runner's binary in the image and asserts its
    # glibc floor. Scanning an image built from a binary that could not ship is
    # scanning something else.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: image

      # The pin and its digest are in ci.mk, alongside the argument for why
      # this is a checksummed install script and not a third-party action.
      - run: make ci-tool-trivy

      # Builds the image from the binary `make build` produced — the same
      # BIN=prebuilt path release.yml takes — and scans it. Before this leg
      # existed a Dockerfile change landed unbuilt and unscanned, and the first
      # place a broken base image showed up was a tag.
      - run: make ci-image

  # The only end-to-end gate, and it replaced one. The compose leg that used to
  # live here put a stock collector in front of one Mira container and asserted
  # three signals came back. That is still asserted — same collector, same
  # generator, same three questions — but through a tier the operator builds
  # from a MiraCluster, so the reconciler, the CRD, the chart and its RBAC are
  # on the path rather than beside it. Keeping both would have tested the OTLP
  # surface twice and the operator once.
  #
  # It is also where the API-server suite runs: `run.sh` calls
  # `make operator-apiserver` as soon as the cluster is up and before it builds
  # anything, because a pruned CRD field or a StatefulSet the API server refuses
  # should fail in thirty seconds, not after two image builds.
  operator-e2e:
    name: operator-e2e
    needs: changes
    # `code` as well as `operator`, because the engine image is half of what
    # this runs — and `docs`, because docs/internals/e2e.md documents it.
    if: >-
      needs.changes.outputs.operator == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.image == 'true' ||
      needs.changes.outputs.docs == 'true'
    # ubuntu-latest, unlike the compose leg this replaced. That one pinned
    # 22.04 because it ran a *release* binary — built by `make build` on the
    # runner — inside the distroless image, which made it the one job that could
    # catch a glibc floor regression. This one compiles the engine inside the
    # Dockerfile against its own pinned base, so the runner's glibc never
    # touches the artefact and the pin would only be pinning the build host.
    # `make ci-image` still covers the floor, on 22.04, where it belongs.
    runs-on: ubuntu-latest
    # Two container builds, a cluster, a collector and a drain. The default 360
    # would hide a hang as a six-hour job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          # The operator's workspace: the API-server suite is a `cargo test` on
          # the runner, and it is the only Rust this leg compiles outside Docker.
          key: operator-e2e
          workspaces: integrations/kubernetes
      # kubectl and helm are on the runner image; kind is not.
      - run: make ci-tool-kind
      - run: make ci-operator-e2e

  release-dry-run:
    name: release-dry-run
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Same pin, because a rehearsal on a different runner than the performance
    # rehearses the wrong thing: `make dist` asserts the tarball's glibc floor,
    # and that assertion is only meaningful against the toolchain that will
    # actually cut the release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: ImageOS
          key: release-dry-run
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-cyclonedx@0.5.9
      # Both halves of the release, run on every code PR: `make dist` is the
      # tarball, the SBOM and SHA256SUMS — literally the targets release.yml
      # calls on a tag — and `make publish-dry` packages all three crates,
      # resolves each against the one before it out of a temporary registry and
      # compiles them, stopping at the upload. The second matters most, because
      # a crates.io version is consumed the moment it uploads and `cargo yank`
      # hides it rather than freeing it.
      - run: make ci-release-dry-run

  helm:
    name: helm
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned, not `latest`. Helm 4 changed OCI defaults and the chart
          # tooling (helm-unittest, helm-docs) tracks the 3.x line; a chart that
          # lints on the runner and not on a contributor's machine is worse than
          # no gate. Move this and the chart's own floor in the same diff.
          version: v3.22.0
      # The unittest plugin and the helm-docs binary, at the versions the
      # Makefile pins — a tool pinned in two places is a tool pinned in neither.
      - run: make ci-tool-chart
      # lint, template, unittest, values-schema and helm-docs drift.
      - run: make ci-helm

  meta:
    name: meta
    # Never gated. This is the job that checks the other jobs, so a change that
    # breaks the gate graph must not be able to skip it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The section-sign gate below reads commit messages, so it needs the
          # commits — a shallow clone has the tree but not the range.
          fetch-depth: 0
      - run: make ci-tool-actionlint

      # Every job in this file must be reachable from a required context below,
      # every `run:` must be a `make ci-*` call, every `uses:` must be
      # SHA-pinned, and no required workflow may carry a trigger-level path
      # filter. Plus the U+00A7 scan over authored files. See crates/xtask/src/ci.rs
      # and scripts/check-section-sign.sh.
      - run: make ci-meta

      # The other two thirds of "authored content": what `git log` prints and
      # what a reviewer reads in the PR list. Neither is a tracked file, so the
      # file scan alone misses both.
      - name: no section sign in the commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-section-range RANGE="${BASE}..HEAD"
      - name: no section sign in the PR title or body
        env:
          # Through the environment, never interpolated into a command: a PR
          # title is attacker-controlled text, and `${{ }}` pastes it in before
          # the shell ever sees it.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        if: github.event_name == 'pull_request'
        run: make ci-section-text

  changeset:
    name: changeset
    needs: changes
    # Three conditions, and each one removes a way this gate could block
    # something it has no business blocking.
    #
    # Only on a pull request: on a push to main the diff is already merged, and
    # a gate that cannot be acted on is noise.
    #
    # Only when the diff ships something — `changes` says so. The Version PR is
    # exempted inside the script rather than here, because the hand-run
    # `make bump` fallback needs the same exemption and one mechanism is enough.
    #
    # Never on Dependabot, which cannot write a changeset and would otherwise go
    # red on every single bump. A dependency change worth a release note gets
    # one from whoever merges it; the gate is for humans, who can.
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.changeset == 'true'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate is a diff against the base, so it needs the range.
          fetch-depth: 0
      - name: this diff declares which version line it moves
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: make ci-changeset BASE="${BASE}"

  # Two status contexts, and branch protection requires both. Every leg above
  # feeds into one of them, so adding a job never means remembering to update a
  # setting in the GitHub UI — and `xtask ci` fails if a job is ever
  # added that neither gate can see.
  #
  # They are split rather than merged because the *contexts* are the stable API
  # between this file and a branch-protection setting nobody in a PR can edit.
  # Security legs arrive at a different rate from correctness legs (a scanner,
  # a SARIF sink, a secret scan), and `security-required` lets them land without
  # a settings change and without diluting what `required` means.
  #
  # These two are the only `run:` steps in this file that are not a make call,
  # and crates/xtask/src/ci.rs allowlists them by name. They read
  # `join(needs.*.result)` — workflow state that exists nowhere but here — so
  # there is nothing for a local target to reproduce.
  required:
    name: required
    if: always()
    needs: [changes, rust, msrv, operator, operator-e2e, ui, coverage, supply-chain, drift, docs, release-dry-run, helm, meta, changeset]
    runs-on: ubuntu-latest
    steps:
      - name: Every leg green or deliberately skipped
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success) ;;
              # `skipped` is a pass on purpose: it is how the `changes` job
              # keeps a docs-only PR from paying for a macOS build. This is the
              # half of the aggregate-gate pattern people get wrong — treating
              # skipped as failure makes path filtering impossible, and treating
              # cancelled as success lets a cancelled run merge.
              skipped) ;;
              *) echo "::error::a required leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"

  # `supply-chain` is deliberately in both closures. It is the RUSTSEC half of
  # the same question `image` asks about the base layer, so it belongs here; and
  # removing it from `required` would mean a repository that has not yet turned
  # on the second context silently stops checking advisories.
  security-required:
    name: security-required
    if: always()
    needs: [changes, supply-chain, image]
    runs-on: ubuntu-latest
    steps:
      - name: Every security leg green or deliberately skipped
        # Same three-case loop as `required`, and for the same reasons — see the
        # comments there. Duplicated rather than factored into a composite
        # action because the check that keeps this honest, in
        # crates/xtask/src/ci.rs, reads `join(needs.*.result` out of the job body:
        # hide it behind a `uses:` and the gate can quietly stop inspecting
        # anything.
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "leg results: ${results}"
          rc=0
          for r in ${results}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a security leg reported '${r}'"; rc=1 ;;
            esac
          done
          exit "${rc}"

  # Merging a version bump is the release. Nothing else in this file writes to
  # the repository, and this job is the reason the two gates above are `needs:`
  # rather than `if:` — it must be unreachable unless every leg was green, and a
  # pull request must never reach it at all.
  #
  # It is the one job not in a required context's closure, because it is
  # *downstream* of both of them; crates/xtask/src/ci.rs carries the exemption
  # with that reason, so the graph check stays honest rather than being widened.
  #
  # scripts/tag-release.sh is a no-op unless Cargo.toml names a version that has
  # no tag, so it runs on every push to main and cuts a release on almost none.
  tag:
    name: tag
    needs: [required, security-required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # To push the tag, and to dispatch release.yml at it. The second is the
      # load-bearing one: a tag pushed with GITHUB_TOKEN does not start a
      # workflow, and `workflow_dispatch` is one of the two events exempt from
      # that rule — which is what lets this work with no PAT and no deploy key.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: make ci-tag
