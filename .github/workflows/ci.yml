name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # `dist/` is checked in and `include_bytes!`d, so the bundle in git is what
  # ships. Two things have to hold: it still builds, and it matches the source
  # it was built from — a fix landed in `src/` and not rebuilt is a fix nobody
  # gets. `--test` is Node's own runner; the UI has no test framework and does
  # not need one for a pure function.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/mira/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code dist

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # A ratchet, not a target. The number is the coverage that existed when
      # this line was last edited; it may only ever go up, and raising it is a
      # one-line diff a reviewer can see. A gate set to an aspiration is a gate
      # that gets switched off the first time it goes red.
      #
      # Destination is 100. What stands between here and there, worst first:
      # block.rs (85%, 59 lines) is the I/O error paths; series.rs (93%, 30) and
      # metrics.rs (94%, 28) are the arms no fixture reaches yet; receiver.rs
      # (89%, 18) is decode failures.
      #
      # Run the same thing locally with:
      #   cargo llvm-cov --workspace --summary-only
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 96
