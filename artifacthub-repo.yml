# Artifact Hub repository metadata for oci://ghcr.io/trianalab/charts/mira.
#
# This file is the ownership proof. Artifact Hub grants the "Verified Publisher"
# badge to a repository whose metadata it can fetch and whose `repositoryID`
# matches the one it issued — which is why the ID below is the real one and not
# a placeholder: a wrong ID is not a warning, it is a silently unverified
# repository. `scripts/check_drift.py` fails the build if the placeholder ever
# comes back.
#
# For an OCI repository there is no `index.yaml` to put this beside, so it
# travels as its own artifact under a reserved tag. `.github/workflows/release.yml`
# pushes it with oras:
#
#   oras push ghcr.io/trianalab/charts/mira:artifacthub.io \
#     --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# Both the tag and the two media types are fixed by Artifact Hub; nothing here
# is a choice.
