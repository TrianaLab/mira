[workspace]
members = ["crates/mira-proto", "crates/mira-core", "crates/mira"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/trianalab/mira"

[workspace.dependencies]
mira-core = { path = "crates/mira-core" }
mira-proto = { path = "crates/mira-proto" }

# Arrow. Pinned as one version across the workspace: arrow_array::RecordBatch
# from two different major versions is two different types, and the error you
# get is unreadable. See docs/ARCHITECTURE.md "Arrow version pin".
arrow-array = "59.3"
arrow-buffer = "59.3"
arrow-ipc = { version = "59.3", default-features = false }
arrow-schema = "59.3"
arrow-select = "59.3"

prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["router", "server", "codegen", "transport"] }
tonic-prost = "0.14"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
memmap2 = "0.9"
crc32fast = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
