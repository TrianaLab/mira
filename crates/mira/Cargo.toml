[package]
name = "miradb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Mira: an OTLP-native telemetry storage engine in a single binary"

[[bin]]
name = "mira"
path = "src/main.rs"

[dependencies]
mira-core.workspace = true
mira-proto.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-types = "0.14"
axum.workspace = true
tokio.workspace = true
bytes.workspace = true
flate2.workspace = true
# The command tree (`main::cli`), which `--help`, the parser and `mira
# completion` all read. Five crates against a tree of 149: clap, clap_builder,
# clap_lex, anstyle and clap_complete. `derive` is off because it costs `syn`
# and its tree to generate a struct `main.rs` would rather write out, and
# `color` is off because everything else this binary prints already decides its
# own colour from `is_terminal`.
clap = { version = "4", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
] }
clap_complete = "4"
# The webhook dispatcher (`alert.rs`). Both are already in the tree under axum
# and tonic, so naming them here costs no crates — only the right to call them.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# Direct https:// webhook targets. Off by default: this is eleven crates
# against a tree of 149 and `ring` is a second C dependency, and both of those
# numbers are stated product properties (README, section 11). Without it an https
# target is refused at load with a message naming this feature.
hyper-rustls = { version = "0.27", default-features = false, optional = true, features = [
  "http1",
  "ring",
  "webpki-tokio",
  "tls12",
] }
# The terminal UI's syscall half: termios, TIOCGWINSZ, poll and localtime_r.
# Kept after the ratatui port because ratatui's own backends do exactly this and
# `CrosstermBackend` costs crossterm, mio, signal-hook and parking_lot for it.
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yaml-rust2 = { version = "0.13.0", default-features = false }
# The terminal UI's layout and widgets. 26 crates against a tree of 149 and a
# 1.88 MSRV floor, both stated product properties (README, section 11), for a
# `Table` and a `Scrollbar` that the hand-rolled renderer got wrong. No backend:
# `term.rs` already owns the pty, so `std` is the only feature on.
ratatui = { version = "0.30", default-features = false, features = ["std"] }

[features]
default = []
webhook-tls = ["dep:hyper-rustls"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# `start_paused`, so the tests that exercise `ADMIT_WAIT` and the sweep timers
# spend their five and sixty seconds on the test's clock. A feature of a crate
# already in the graph, so it costs no crates — and it is dev-only, so the
# released binary does not carry the mock clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
