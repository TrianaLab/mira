# Default values for mira-operator.

image:
  # -- Operator image repository.
  repository: ghcr.io/trianalab/mira-operator
  # -- Pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag. Defaults to the chart's appVersion.
  tag: ""

# -- Image pull secrets for a private registry.
imagePullSecrets: []
# -- Overrides the chart name in resource names.
nameOverride: ""
# -- Overrides the full generated resource name.
fullnameOverride: ""

# -- Replicas. Extras are warm standbys, not extra capacity: a
# `coordination.k8s.io` Lease means exactly one reconciles and the rest wait.
# Raise it to shorten the gap after a node failure, not to go faster. The
# Deployment's `Recreate` strategy is the other half — the lease makes an
# overlap survivable, Recreate makes upgrades not pay for one.
replicaCount: 1

rbac:
  # -- Create the ClusterRole and binding the operator needs.
  create: true
  # -- Restrict the operator to a list of namespaces: a Role in each instead of
  # one ClusterRole, and a watch scoped to match, since a Role can authorise
  # nothing wider. Empty means cluster-wide.
  namespaces: []

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations for the ServiceAccount (IRSA, Workload Identity).
  annotations: {}
  # -- Name to use. Generated from the fullname when empty.
  name: ""

# -- Log filter, in `tracing-subscriber` `EnvFilter` syntax. `kube=warn` keeps
# the client's per-request lines out of a log that should be one line per
# decision.
logLevel: "info,kube=warn"

clusterEvents:
  # -- Ship Kubernetes Events and container state changes to a Mira as OTLP
  # logs, so an agent writing an RCA can see an `OOMKilled` or a
  # `FailedScheduling` on the same timeline as the telemetry. An OTLP/HTTP base
  # URL — `http://my-mira-proxy.mira.svc:4318` — and empty is off.
  #
  # This one value is the whole switch: it sets the operator's endpoint *and*
  # creates the read-only Role below. Two switches would mean an endpoint
  # without the Role, which is an operator taking 403s in a loop.
  #
  # Note what the Role grants: `get`/`list`/`watch` on pods cluster-wide, which
  # includes `spec.containers[].env` and so any secret inlined there. The
  # exporter reads only `status` and never emits a spec field, but the
  # permission is wider than the use — scope it with `rbac.namespaces` if that
  # matters in your cluster.
  endpoint: ""

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod-level security context. The operator writes nothing and needs no
# identity beyond its token.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Resource requests and limits. The controller is idle between reconciles;
# the ceiling exists to make it evictable rather than because it is reached.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity.
affinity: {}
