suite: deployment
templates:
  - templates/deployment.yaml
release:
  name: mira-operator
  namespace: mira-system
tests:
  # Two controllers with no leader election both reconcile every MiraCluster and
  # both act on the same reading. A rolling update creates exactly that overlap
  # for the length of the rollout, so the strategy has to be Recreate.
  - it: never runs two controllers at once
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.replicas
          value: 1

  # The one pod in this repo that is supposed to have a token. The engine's own
  # StatefulSet turns it off, and this being explicit is what makes the
  # difference deliberate rather than inherited from a default.
  - it: mounts a service account token
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
      - equal:
          path: spec.template.spec.serviceAccountName
          value: mira-operator

  - it: defaults the image tag to the chart appVersion
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^ghcr\.io/trianalab/mira-operator:\d+\.\d+\.\d+$'

  - it: takes an explicit tag
    set:
      image:
        tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/trianalab/mira-operator:1.2.3

  # A version label in the selector makes the first `helm upgrade` fail on an
  # immutable field and leaves the release wedged.
  - it: keeps the version out of the immutable selector
    asserts:
      - isNull:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: mira-operator

  - it: runs unprivileged with a read-only root
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: passes the log filter through
    set:
      logLevel: "debug,kube=info"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "debug,kube=info"
