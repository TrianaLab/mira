apiVersion: v2
name: mira-operator
description: The controller that scales a Mira tier on free disk, and drains a replica's blocks to cold storage before its volume is deleted. Install it, then apply a MiraCluster.
type: application
# Versioned independently of the engine, and the only chart Mira publishes. The
# operator is a separate binary with a separate dependency tree and a separate
# release cadence — a controller bug fix should not require a Mira release, and
# a Mira release should not require republishing a controller that did not
# change. This number is the operator's source of truth: `operator-meta` in
# release.yml reads it, `make drift` deliberately does not, and `make bump`
# must leave it alone.
version: 0.1.0
appVersion: "0.1.0"
# `apiextensions.k8s.io/v1` CRDs and server-side apply are both far older, but
# the operator patches with `fieldManager` + `force`, which is 1.22+. 1.25 is
# where `PodSecurity` went stable, which is what the pod's securityContext is
# written against.
kubeVersion: ">=1.25.0-0"
keywords:
  - otlp
  - opentelemetry
  - observability
  - operator
  - autoscaling
  - arrow
icon: https://raw.githubusercontent.com/TrianaLab/mira/refs/heads/main/docs/assets/mira-mark.svg
home: https://miradb.dev/
maintainers:
  - name: edu-diaz
    url: https://edudiaz.dev
    email: edudiazasencio@gmail.com
sources:
  - https://github.com/TrianaLab/mira/tree/main/charts/mira-operator
  - https://github.com/TrianaLab/mira/tree/main/integrations/kubernetes
  - https://github.com/TrianaLab/mira
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/crds: |
    - kind: MiraCluster
      version: v1alpha1
      name: miraclusters.mira.miradb.dev
      displayName: Mira Cluster
      description: A Mira storage tier and the proxy in front of it, scaled on free disk.
  artifacthub.io/links: |
    - name: support
      url: https://github.com/TrianaLab/mira/issues
    - name: documentation
      url: https://miradb.dev/
  artifacthub.io/images: |
    - name: mira-operator
      image: ghcr.io/trianalab/mira-operator:0.1.0
