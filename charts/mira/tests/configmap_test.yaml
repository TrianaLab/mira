# The ConfigMap is the whole of Mira's configuration, and its format is not
# free-form: KYAML wants every scalar quoted, and Mira refuses a value that
# arrived as a number or a boolean instead of coercing it (docs/config.md). A
# template that renders `wal: false` rather than `"false"` therefore does not
# misconfigure the node, it stops it from booting — so the assertion that
# matters is on the exact bytes, not on the keys.
suite: configmap
templates:
  - templates/configmap.yaml
release:
  name: mira
  namespace: observability
tests:
  - it: renders the default config verbatim
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data["mira.yaml"]
          value: |
            {
              "node": "${env:POD_NAME}",
              "listen": {
                "grpc": "0.0.0.0:4317",
                "http": "0.0.0.0:4318",
              },
              "storage": {
                "dir": "/data",
                "retention": "7d",
              },
              "ingest": {
                "max_request_bytes": "16MiB",
                "queue": "128",
                "shards": "0",
                "wal": "true",
              },
              "telemetry": {
                "self": "false",
                "interval": "15s",
              },
            }

  - it: carries every value through to the file
    set:
      config.node: mira-eu-west-1
      config.storage.retention: 720h
      config.ingest.maxRequestBytes: 64MiB
      config.ingest.queue: 1024
      config.ingest.shards: 4
      config.ingest.wal: false
      config.telemetry.self: true
      config.telemetry.interval: 60s
    asserts:
      - equal:
          path: data["mira.yaml"]
          value: |
            {
              "node": "mira-eu-west-1",
              "listen": {
                "grpc": "0.0.0.0:4317",
                "http": "0.0.0.0:4318",
              },
              "storage": {
                "dir": "/data",
                "retention": "720h",
              },
              "ingest": {
                "max_request_bytes": "64MiB",
                "queue": "1024",
                "shards": "4",
                "wal": "false",
              },
              "telemetry": {
                "self": "true",
                "interval": "60s",
              },
            }

  # `wal` is a bool in values because that is what it is to whoever sets it, and
  # a string in the file because that is the only thing Mira's parser accepts.
  - it: quotes the flags that are booleans in values
    set:
      config.ingest.wal: false
      config.telemetry.self: true
    asserts:
      - matchRegex:
          path: data["mira.yaml"]
          pattern: '"wal": "false",'
      - matchRegex:
          path: data["mira.yaml"]
          pattern: '"self": "true",'

  # `shards` is an integer in values because an operator sets it from a CPU
  # limit, and 16 is the ceiling the engine enforces — so this is the schema's
  # upper bound and the quoting rule in one case.
  - it: quotes a pinned shard count
    set:
      config.ingest.shards: 16
    asserts:
      - matchRegex:
          path: data["mira.yaml"]
          pattern: '"shards": "16",'

  - it: says nothing about alerts by default
    asserts:
      - notMatchRegex:
          path: data["mira.yaml"]
          pattern: '"alerts"'
      - notExists:
          path: data["alerts.kyaml"]

  - it: writes the rules beside the config and points at them
    set:
      config.alerts.rules: |
        { rules: [ { name: r, query: { signal: traces }, over: 1m, when: "count > 5" } ] }
    asserts:
      - matchRegex:
          path: data["mira.yaml"]
          pattern: '"rules": "/etc/mira/alerts.kyaml",'
      - equal:
          path: data["alerts.kyaml"]
          value: |
            { rules: [ { name: r, query: { signal: traces }, over: 1m, when: "count > 5" } ] }

  - it: refuses alert rules on more than one replica
    set:
      replicaCount: 2
      config.alerts.rules: "{ rules: [] }"
    asserts:
      - failedTemplate:
          errorPattern: "nothing elects an evaluator"
