suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: mira
  namespace: observability
tests:
  - it: creates an account with no token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: mira
      # Mira never calls the API server. A mounted token would be blast radius
      # with no upside, so this default is the assertion, not a preference.
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: creates nothing when told not to
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: takes annotations, for IRSA and friends
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::1:role/mira
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1:role/mira
