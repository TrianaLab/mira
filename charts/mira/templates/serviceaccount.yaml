{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mira.serviceAccountName" . }}
  labels:
    {{- include "mira.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role, no RoleBinding, no ClusterRole anywhere in this chart, and that is
# not an omission: Mira never calls the API server. It reads OTLP from a socket
# and writes Arrow to a directory. An account with no permissions and no token
# is the whole of its cluster identity.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
