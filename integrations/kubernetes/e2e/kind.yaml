# The cluster `make operator-e2e` runs against.
#
# One node. A multi-node cluster would let the StatefulSet's pods land on
# different hosts, which sounds more realistic and is the opposite of what this
# gate wants: Kind's default StorageClass is rancher local-path, so a volume is
# a directory on the node that provisioned it, and a pod rescheduled elsewhere
# waits forever for a claim it can never bind. The scale-in this suite exercises
# is about a claim outliving its pod on the *same* node, which is exactly what
# one node gives.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
