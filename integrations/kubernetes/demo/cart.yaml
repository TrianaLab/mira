# A pod that is really dying, so the operator has something true to say.
#
# Everything else in this demo is telemetry an application volunteered. This is
# the other half: `cart` runs no SDK, exports nothing, and would be invisible to
# a store that only holds what was sent to it. What Mira knows about it, it
# knows because the operator watched the API server — the kubelet's `BackOff`
# Event and the `OOMKilled` on the container's own status, both arriving as
# ordinary OTLP logs on the one timeline.
#
# 16Mi against a process that allocates without bound, so the kill is the
# kernel's and not a `sleep` and an exit code. It restarts, is killed again, and
# `k8s.container.restart_count` climbs — which is what makes it read as a memory
# limit that is too low rather than as one bad afternoon.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
spec:
  replicas: 1
  selector:
    matchLabels: { app: cart }
  template:
    metadata:
      labels: { app: cart }
    spec:
      containers:
        - name: cart
          image: busybox:1.37
          # The canonical memory bomb: `tail` buffers what it reads and
          # /dev/zero never ends.
          command: ["sh", "-c", "tail /dev/zero"]
          resources:
            limits: { memory: 16Mi }
