# The cluster `make demo-cluster` runs on.
#
# One node, for the same reason `e2e/kind.yaml` uses one: Kind's default
# StorageClass is rancher local-path, so a volume is a directory on the node
# that provisioned it and a pod rescheduled elsewhere waits forever.
#
# The port mapping is what makes this a *localhost* demo rather than a cluster
# you have to port-forward into. 30080 is the fixed nodePort the Gateway's
# Service is pinned to in `gateway.yaml`; 8080 is where it comes out on the
# host. Neither is 4318, on purpose — `make demo` binds that, and the two
# demos have to be runnable at the same time.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
